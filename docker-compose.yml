services:
  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_EXTERNAL_PORT}:80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    restart: unless-stopped

  db:
    image: mysql:8.0
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Defina DB_NAME no .env}
      MYSQL_USER: ${DB_USER:?Defina DB_USER no .env}
      MYSQL_PASSWORD: ${DB_PASS:?Defina DB_PASS no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Defina DB_ROOT_PASS no .env}
    ports:
      - "${DB_EXTERNAL_PORT}:3306"
    volumes:
      - aloha_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  aloha_mysql_data:
